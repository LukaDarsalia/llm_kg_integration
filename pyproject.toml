[project]
name = "llm-kg-integration"
version = "0.1.0"
description = "A workspace for benchmarking and improving GraphRAG indexer/retriever methods on GraphRAG-Bench."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # --- pipeline core (orchestration, storage, experiment tracking) ---
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "wandb>=0.17",
    "boto3>=1.34",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    # --- method: LightRAG (official SDK) + local embedding/LLM plumbing ---
    "lightrag-hku==1.5.3",
    "openai>=1.40",
    "torch>=2.2",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    # --- benchmark evaluation: pinned to GraphRAG-Bench upstream for leaderboard parity ---
    # (these mirror third_party/GraphRAG-Benchmark/requirements.txt so the vendored
    #  metric functions behave identically to the public leaderboard)
    "datasets==3.3.2",
    "langchain==0.3.26",
    "langchain-core==0.3.69",
    "langchain-openai==0.3.28",
    "langchain-community>=0.3,<0.4",
    "ragas==0.2.15",
    "rouge-score==0.1.2",
    "pydantic==2.11.7",
    "json5",
    "json-repair",
]

[project.optional-dependencies]
# Graph-structure (indexing) evaluation dimension. Optional because it pulls igraph.
indexing = ["igraph>=0.11"]

[tool.uv]
# This is a "virtual" project: uv manages the dependency venv but does NOT build/install
# `src` as a package. Stages are run as modules from the repo root, e.g.
#   uv run python -m src.pipeline.loader.runner --help
# which puts the repo root (and therefore `src`) on sys.path automatically.
package = false
