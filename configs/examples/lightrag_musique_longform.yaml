# Controlled experiment: same MuSiQue setup as lightrag_musique_full.yaml, but
# uses LightRAG's verbatim upstream long-form rag_response prompt.
# Tests the hypothesis that our higher F1 vs published LightRAG numbers
# is driven by prompt choice (short-answer vs long-form markdown+refs).
#
# Indexing is fully cached from the prior run; only generation changes.
# Expected incremental cost: ~$1 (1000 generation calls, no cache reuse since
# the prompt template differs).

method:
  name: lightrag
  params:
    chunk_size: 1200
    chunk_overlap: 100
    max_gleaning: 0
    max_concurrent_extract: 16
    top_k_entities: 40
    top_k_chunks: 20
    cosine_threshold: 0.2
    prompt_style: longform_upstream

llm: {name: openrouter, params: {model: openai/gpt-4o-mini, temperature: 0.0, max_tokens: 2048}, cache: true}
embedder: {name: openrouter, params: {model: openai/text-embedding-3-small, dim: 1536}, cache: true}

storage:
  vector: {name: numpy, params: {}}
  graph: {name: networkx, params: {}}
  kv: {name: jsonfile, params: {path: .cache/lightrag_musique/kv.json}}

dataset: {name: musique, params: {cache_dir: .cache/musique, n_queries: 1000}}
evaluator: {name: extractive, params: {recall_ks: [1, 5, 20]}}

logger:
  name: wandb
  project: llm-kg-research
  run_name: lightrag-musique-1000-longform

cache_dir: .cache/lightrag_musique
seed: 0
