# Phase 3 full run: 1000 MuSiQue queries (HippoRAG-compatible sample).
# Reuses .cache/lightrag_musique so the 50 queries indexed earlier stay warm.
# Expected incremental cost: ~$10–12 (indexing the remaining ~10,800 chunks).

method:
  name: lightrag
  params:
    chunk_size: 1200
    chunk_overlap: 100
    max_gleaning: 0
    max_concurrent_extract: 16
    top_k_entities: 40
    top_k_chunks: 20
    cosine_threshold: 0.2

llm:
  name: openrouter
  params:
    model: openai/gpt-4o-mini
    temperature: 0.0
    max_tokens: 2048
  cache: true

embedder:
  name: openrouter
  params:
    model: openai/text-embedding-3-small
    dim: 1536
  cache: true

storage:
  vector: {name: numpy, params: {}}
  graph: {name: networkx, params: {}}
  kv: {name: jsonfile, params: {path: .cache/lightrag_musique/kv.json}}

dataset:
  name: musique
  params:
    cache_dir: .cache/musique
    n_queries: 1000

evaluator:
  name: extractive
  params:
    recall_ks: [1, 5, 20]

logger: {name: "null"}
cache_dir: .cache/lightrag_musique
seed: 0
